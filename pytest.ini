[pytest]
# The installed `libtmux` ships a pytest plugin that is incompatible with this
# pytest version ("Marks cannot be applied to fixtures") and breaks collection
# for the whole repo before a single test runs. We don't use it — switch it off
# here so `pytest` just works without anyone remembering `-p no:libtmux`.
addopts = -p no:libtmux
testpaths = tests
python_files = test_*.py
